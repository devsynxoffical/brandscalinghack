    <!-- Google Analytics 4 (G-4NHL9F0B3C). gtag.js loads after the page has rendered so it does
         not compete with the hero for bandwidth; calls made earlier queue in dataLayer.
         SPA page views come from GA4 enhanced measurement (browser history changes). -->
    <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-4NHL9F0B3C');
    (function () {
      // Only the live site reports to GA4, so local and preview builds do not pollute the data
      if (location.hostname !== 'www.brandscalinghacks.com') return;
      var load = function () {
        var s = document.createElement('script');
        s.async = true;
        s.src = 'https://www.googletagmanager.com/gtag/js?id=G-4NHL9F0B3C';
        document.head.appendChild(s);
      };
      if (document.readyState === 'complete') setTimeout(load, 1500);
      else window.addEventListener('load', function () { setTimeout(load, 1500); });
      // Lead actions: WhatsApp chats, booking-page and calendar links, email and phone.
      document.addEventListener('click', function (e) {
        var a = e.target && e.target.closest ? e.target.closest('a[href]') : null;
        if (!a) return;
        var h = a.getAttribute('href') || '';
        var method = /wa\.me|whatsapp\.com/.test(h) ? 'whatsapp'
          : /^\/book\/?$|calendar\.app\.google|calendar\.google\.com/.test(h) ? 'book_call'
          : /^mailto:/.test(h) ? 'email' : /^tel:/.test(h) ? 'phone' : null;
        if (!method) return;
        var params = { method: method, link_url: h.slice(0, 100), page_path: location.pathname };
        // One event per channel, plus generate_lead (the key event) for WhatsApp and booking clicks
        gtag('event', { whatsapp: 'click_whatsapp', book_call: 'book_click', email: 'click_email', phone: 'click_phone' }[method], params);
        if (method === 'whatsapp' || method === 'book_call') gtag('event', 'generate_lead', params);
      }, true);
      // scroll_75: once per page view (the SPA changes path without reloading)
      var scrolledFor = null;
      window.addEventListener('scroll', function () {
        if (scrolledFor === location.pathname) return;
        var d = document.documentElement;
        if ((window.scrollY + window.innerHeight) / Math.max(d.scrollHeight, 1) >= 0.75) {
          scrolledFor = location.pathname;
          gtag('event', 'scroll_75', { page_path: location.pathname });
        }
      }, { passive: true });
      // tool_used: first input change on any calculator, once per page view
      var toolFor = null;
      document.addEventListener('input', function (e) {
        var t = e.target;
        if (!t || t.tagName !== 'INPUT' || toolFor === location.pathname) return;
        if (!/^\/(tools\/|roas-calculator)/.test(location.pathname)) return;
        toolFor = location.pathname;
        gtag('event', 'tool_used', { page_path: location.pathname });
      }, true);
    })();
    </script>
