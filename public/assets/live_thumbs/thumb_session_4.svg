<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <linearGradient id="bgGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#022c22"/>
      <stop offset="35%" stop-color="#064e3b"/>
      <stop offset="70%" stop-color="#047857"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <radialGradient id="glowEmerald" cx="75%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#34d399" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowAmber" cx="25%" cy="80%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="textGradGoldGreen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#a7f3d0"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <filter id="shadow4" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1280" height="720" fill="url(#bgGrad4)"/>
  <rect width="1280" height="720" fill="url(#glowEmerald)"/>
  <rect width="1280" height="720" fill="url(#glowAmber)"/>

  <!-- Grid overlay -->
  <g stroke="rgba(255,255,255,0.06)" stroke-width="1">
    <line x1="0" y1="120" x2="1280" y2="120"/>
    <line x1="0" y1="240" x2="1280" y2="240"/>
    <line x1="0" y1="360" x2="1280" y2="360"/>
    <line x1="0" y1="480" x2="1280" y2="480"/>
    <line x1="0" y1="600" x2="1280" y2="600"/>
    <line x1="160" y1="0" x2="160" y2="720"/>
    <line x1="320" y1="0" x2="320" y2="720"/>
    <line x1="480" y1="0" x2="480" y2="720"/>
    <line x1="640" y1="0" x2="640" y2="720"/>
    <line x1="800" y1="0" x2="800" y2="720"/>
    <line x1="960" y1="0" x2="960" y2="720"/>
    <line x1="1120" y1="0" x2="1120" y2="720"/>
  </g>

  <!-- Top Badges -->
  <g transform="translate(80, 80)">
    <!-- LIVE CRO Masterclass Badge -->
    <rect x="0" y="0" width="130" height="42" rx="21" fill="#10b981"/>
    <circle cx="24" cy="21" r="6" fill="#ffffff"/>
    <text x="44" y="27" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" font-size="16" font-weight="900" letter-spacing="1.5">LIVE</text>

    <!-- Masterclass Badge -->
    <rect x="145" y="0" width="300" height="42" rx="21" fill="rgba(255,255,255,0.12)" stroke="rgba(255,255,255,0.25)" stroke-width="1.5"/>
    <text x="165" y="26" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" font-size="15" font-weight="800" letter-spacing="1">STORE CONVERSION RATE (CRO)</text>
  </g>

  <!-- Giant Headline -->
  <g transform="translate(80, 240)" filter="url(#shadow4)">
    <text x="0" y="0" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" font-size="34" font-weight="900" letter-spacing="3" text-transform="uppercase">STORE OPTIMIZATION MATRIX</text>
    <text x="0" y="100" fill="url(#textGradGoldGreen)" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" font-size="94" font-weight="950" letter-spacing="-2">E-COMMERCE 5% CVR</text>
    <text x="0" y="195" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" font-size="94" font-weight="950" letter-spacing="-2">CONVERSION HACKS</text>
  </g>

  <!-- Subtitle / Hook -->
  <text x="80" y="520" fill="rgba(255,255,255,0.85)" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" font-size="24" font-weight="600">
    How Our Clients Achieve 5%+ Conversion Rates While Industry Averages 1.82%
  </text>

  <!-- Bottom Metric Tags -->
  <g transform="translate(80, 580)">
    <rect x="0" y="0" width="220" height="54" rx="14" fill="rgba(15,23,42,0.75)" stroke="rgba(52,211,153,0.5)" stroke-width="1.5"/>
    <text x="22" y="34" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" font-size="18" font-weight="850">📈 5.2% STORE CVR</text>

    <rect x="235" y="0" width="190" height="54" rx="14" fill="rgba(15,23,42,0.75)" stroke="rgba(255,255,255,0.15)" stroke-width="1.5"/>
    <text x="255" y="34" fill="#fde047" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" font-size="18" font-weight="800">⏱ 1:54:12 DURATION</text>

    <rect x="440" y="0" width="220" height="54" rx="14" fill="rgba(15,23,42,0.75)" stroke="rgba(74,222,128,0.4)" stroke-width="1.5"/>
    <text x="460" y="34" fill="#4ade80" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" font-size="18" font-weight="800">✓ GAURAV KAPOOR</text>
  </g>

  <!-- Play Circle Icon Graphics on Right Side -->
  <g transform="translate(1040, 360)" filter="url(#shadow4)">
    <circle cx="0" cy="0" r="100" fill="rgba(52,211,153,0.2)" stroke="rgba(52,211,153,0.6)" stroke-width="2"/>
    <circle cx="0" cy="0" r="76" fill="linear-gradient(135deg, #059669 0%, #d97706 100%)"/>
    <polygon points="-16,-30 36,0 -16,30" fill="#ffffff"/>
  </g>
</svg>
