<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090514"/>
      <stop offset="35%" stop-color="#2e1065"/>
      <stop offset="70%" stop-color="#6b21a8"/>
      <stop offset="100%" stop-color="#be185d"/>
    </linearGradient>
    <radialGradient id="glowViolet" cx="80%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowCyan" cx="20%" cy="80%" r="50%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="textGradViolet" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#fbcfe8"/>
      <stop offset="100%" stop-color="#f472b6"/>
    </linearGradient>
    <filter id="shadow2" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1280" height="720" fill="url(#bgGrad2)"/>
  <rect width="1280" height="720" fill="url(#glowViolet)"/>
  <rect width="1280" height="720" fill="url(#glowCyan)"/>

  <!-- Grid overlay -->
  <g stroke="rgba(255,255,255,0.06)" stroke-width="1">
    <line x1="0" y1="120" x2="1280" y2="120"/>
    <line x1="0" y1="240" x2="1280" y2="240"/>
    <line x1="0" y1="360" x2="1280" y2="360"/>
    <line x1="0" y1="480" x2="1280" y2="480"/>
    <line x1="0" y1="600" x2="1280" y2="600"/>
    <line x1="160" y1="0" x2="160" y2="720"/>
    <line x1="320" y1="0" x2="320" y2="720"/>
    <line x1="480" y1="0" x2="480" y2="720"/>
    <line x1="640" y1="0" x2="640" y2="720"/>
    <line x1="800" y1="0" x2="800" y2="720"/>
    <line x1="960" y1="0" x2="960" y2="720"/>
    <line x1="1120" y1="0" x2="1120" y2="720"/>
  </g>

  <!-- Top Badges -->
  <g transform="translate(80, 80)">
    <!-- REPLAY Badge -->
    <rect x="0" y="0" width="150" height="42" rx="21" fill="#8b5cf6"/>
    <text x="24" y="27" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" font-size="16" font-weight="900" letter-spacing="1.5">⚡ REPLAY</text>

    <!-- Masterclass Badge -->
    <rect x="165" y="0" width="280" height="42" rx="21" fill="rgba(255,255,255,0.12)" stroke="rgba(255,255,255,0.25)" stroke-width="1.5"/>
    <text x="185" y="26" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" font-size="15" font-weight="800" letter-spacing="1">ADS COPYWRITING MASTERCLASS</text>
  </g>

  <!-- Giant Headline -->
  <g transform="translate(80, 240)" filter="url(#shadow2)">
    <text x="0" y="0" fill="#f472b6" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" font-size="34" font-weight="900" letter-spacing="3" text-transform="uppercase">2.05 HOURS INTENSIVE</text>
    <text x="0" y="100" fill="url(#textGradViolet)" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" font-size="94" font-weight="950" letter-spacing="-2">$100K FACEBOOK</text>
    <text x="0" y="195" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" font-size="94" font-weight="950" letter-spacing="-2">ADS COPY SYSTEM</text>
  </g>

  <!-- Subtitle / Hook -->
  <text x="80" y="520" fill="rgba(255,255,255,0.85)" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" font-size="24" font-weight="600">
    Psychological &amp; Emotional Direct-Response Hooks for Multi-Niche DTC
  </text>

  <!-- Bottom Metric Tags -->
  <g transform="translate(80, 580)">
    <rect x="0" y="0" width="260" height="54" rx="14" fill="rgba(15,23,42,0.75)" stroke="rgba(236,72,153,0.5)" stroke-width="1.5"/>
    <text x="22" y="34" fill="#f472b6" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" font-size="18" font-weight="850">🧠 COPYWRITING MATRIX</text>

    <rect x="275" y="0" width="190" height="54" rx="14" fill="rgba(15,23,42,0.75)" stroke="rgba(255,255,255,0.15)" stroke-width="1.5"/>
    <text x="295" y="34" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" font-size="18" font-weight="800">⏱ 2:05:14 DURATION</text>

    <rect x="480" y="0" width="220" height="54" rx="14" fill="rgba(15,23,42,0.75)" stroke="rgba(74,222,128,0.4)" stroke-width="1.5"/>
    <text x="500" y="34" fill="#4ade80" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" font-size="18" font-weight="800">✓ GAURAV KAPOOR</text>
  </g>

  <!-- Play Circle Icon Graphics on Right Side -->
  <g transform="translate(1040, 360)" filter="url(#shadow2)">
    <circle cx="0" cy="0" r="100" fill="rgba(168,85,247,0.2)" stroke="rgba(168,85,247,0.6)" stroke-width="2"/>
    <circle cx="0" cy="0" r="76" fill="linear-gradient(135deg, #a855f7 0%, #ec4899 100%)"/>
    <polygon points="-16,-30 36,0 -16,30" fill="#ffffff"/>
  </g>
</svg>
