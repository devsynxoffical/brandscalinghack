<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <linearGradient id="bgGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0a1a"/>
      <stop offset="40%" stop-color="#1e1035"/>
      <stop offset="75%" stop-color="#831843"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <radialGradient id="glow1" cx="80%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#f97316" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#f97316" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowPurple" cx="20%" cy="80%" r="50%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="textGradGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#fed7aa"/>
      <stop offset="100%" stop-color="#fb923c"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1280" height="720" fill="url(#bgGrad1)"/>
  <rect width="1280" height="720" fill="url(#glow1)"/>
  <rect width="1280" height="720" fill="url(#glowPurple)"/>

  <!-- Grid overlay -->
  <g stroke="rgba(255,255,255,0.06)" stroke-width="1">
    <line x1="0" y1="120" x2="1280" y2="120"/>
    <line x1="0" y1="240" x2="1280" y2="240"/>
    <line x1="0" y1="360" x2="1280" y2="360"/>
    <line x1="0" y1="480" x2="1280" y2="480"/>
    <line x1="0" y1="600" x2="1280" y2="600"/>
    <line x1="160" y1="0" x2="160" y2="720"/>
    <line x1="320" y1="0" x2="320" y2="720"/>
    <line x1="480" y1="0" x2="480" y2="720"/>
    <line x1="640" y1="0" x2="640" y2="720"/>
    <line x1="800" y1="0" x2="800" y2="720"/>
    <line x1="960" y1="0" x2="960" y2="720"/>
    <line x1="1120" y1="0" x2="1120" y2="720"/>
  </g>

  <!-- Top Badges -->
  <g transform="translate(80, 80)">
    <!-- LIVE Badge -->
    <rect x="0" y="0" width="130" height="42" rx="21" fill="#ef4444"/>
    <circle cx="24" cy="21" r="6" fill="#ffffff"/>
    <text x="44" y="27" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" font-size="16" font-weight="900" letter-spacing="1.5">LIVE</text>

    <!-- Masterclass Badge -->
    <rect x="145" y="0" width="260" height="42" rx="21" fill="rgba(255,255,255,0.12)" stroke="rgba(255,255,255,0.25)" stroke-width="1.5"/>
    <text x="165" y="26" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" font-size="15" font-weight="800" letter-spacing="1">ADVANCED FACEBOOK ADS</text>
  </g>

  <!-- Giant Headline -->
  <g transform="translate(80, 240)" filter="url(#shadow)">
    <text x="0" y="0" fill="#fb923c" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" font-size="34" font-weight="900" letter-spacing="3" text-transform="uppercase">LIVE MASTERCLASS</text>
    <text x="0" y="100" fill="url(#textGradGold)" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" font-size="94" font-weight="950" letter-spacing="-2">$100K BRAND</text>
    <text x="0" y="195" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" font-size="94" font-weight="950" letter-spacing="-2">SCALING EVENT</text>
  </g>

  <!-- Subtitle / Hook -->
  <text x="80" y="520" fill="rgba(255,255,255,0.85)" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" font-size="24" font-weight="600">
    Copy-Paste Blueprint: Scaling from $10k to $100k/mo with Meta Ads
  </text>

  <!-- Bottom Metric Tags -->
  <g transform="translate(80, 580)">
    <rect x="0" y="0" width="220" height="54" rx="14" fill="rgba(15,23,42,0.75)" stroke="rgba(255,87,34,0.5)" stroke-width="1.5"/>
    <text x="22" y="34" fill="#ff7a45" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" font-size="18" font-weight="850">🚀 5.4X ROAS BLUEPRINT</text>

    <rect x="235" y="0" width="190" height="54" rx="14" fill="rgba(15,23,42,0.75)" stroke="rgba(255,255,255,0.15)" stroke-width="1.5"/>
    <text x="255" y="34" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" font-size="18" font-weight="800">⏱ 1:45:20 DURATION</text>

    <rect x="440" y="0" width="220" height="54" rx="14" fill="rgba(15,23,42,0.75)" stroke="rgba(74,222,128,0.4)" stroke-width="1.5"/>
    <text x="460" y="34" fill="#4ade80" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" font-size="18" font-weight="800">✓ GAURAV KAPOOR</text>
  </g>

  <!-- Play Circle Icon Graphics on Right Side -->
  <g transform="translate(1040, 360)" filter="url(#shadow)">
    <circle cx="0" cy="0" r="100" fill="rgba(255,87,34,0.2)" stroke="rgba(255,87,34,0.6)" stroke-width="2"/>
    <circle cx="0" cy="0" r="76" fill="linear-gradient(135deg, #ff5722 0%, #dc2626 100%)"/>
    <polygon points="-16,-30 36,0 -16,30" fill="#ffffff"/>
  </g>
</svg>
